<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Settings — Meimo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>(function(){try{var t=localStorage.getItem("notes-app-theme");if(t)document.documentElement.setAttribute("data-theme",t);var lang=localStorage.getItem("notes-app-lang");if(lang==="id"||lang==="ja"||lang==="en")document.documentElement.setAttribute("lang",lang);else document.documentElement.setAttribute("lang","en");}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/variables.css">
<link rel="stylesheet" href="/src/css/themes.css">
<link rel="stylesheet" href="/src/css/view-transitions.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/typography.css">
<link rel="stylesheet" href="/src/css/layout.css">
<link rel="stylesheet" href="/src/css/notes-list.css">
<link rel="stylesheet" href="/src/css/backup-import.css">
<link rel="stylesheet" href="/src/css/components.css">
<link rel="stylesheet" href="/src/css/settings.css">
<link rel="stylesheet" href="/src/css/animations.css">
<link rel="stylesheet" href="/src/css/responsive.css">
</head>
<body>

<div class="page">

  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Back" data-i18n-aria="nav.back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting" data-i18n="settings.title">Settings</div>
    </div>
  </header>

  <main class="home-content">

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="settings.section.general">General</span>
      </div>
      <div class="backup-actions">
        <a href="/font-manager" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"></polyline>
              <line x1="9" y1="20" x2="15" y2="20"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.fontLibrary.title">Font Library</span>
            <span class="backup-action-btn__desc" data-i18n="settings.fontLibrary.desc">Download &amp; manage fonts for the editor</span>
          </span>
        </a>

        <button type="button" class="backup-action-btn" id="settingsThemeBtn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.theme.title">Choose Theme</span>
            <span class="backup-action-btn__desc" data-i18n="settings.theme.desc">Light, Dark, Sepia, Paper, OLED</span>
          </span>
        </button>

        <button type="button" class="backup-action-btn" id="settingsLanguageBtn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.language.title">Language</span>
            <span class="backup-action-btn__desc" data-i18n="settings.language.desc">English, Indonesian, Japanese</span>
          </span>
        </button>


        <a href="/trash" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.trash.title">Trash</span>
            <span class="backup-action-btn__desc" data-i18n="settings.trash.desc">Restore or permanently delete notes</span>
          </span>
        </a>

        <a href="/cadangkan" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12"></path>
              <path d="M7 10l5 5 5-5"></path>
              <path d="M4 19h16"></path>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.backup.title">Backup &amp; Import</span>
            <span class="backup-action-btn__desc" data-i18n="settings.backup.desc">Export/import notes (.zip / .meimo)</span>
          </span>
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title">AI</span>
      </div>
      <div class="backup-actions">
        <a href="/fitur-ai" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"></path>
              <path d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75L19 14z"></path>
              <path d="M5 15l.5 1.5L7 17l-1.5.5L5 19l-.5-1.5L3 17l1.5-.5L5 15z"></path>
            </svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title" data-i18n="settings.ai.title">AI Features</span>
            <span class="backup-action-btn__desc" data-i18n="settings.ai.desc">Gemini API key &amp; model</span>
          </span>
        </a>
      </div>
    </section>

  </main>

</div>

<script type="module" src="/src/js/settings/settings.js"></script>
<script type="module" src="/src/js/pwa/sw-register.js"></script>
<script type="module" src="/src/js/utils/native-feel.js"></script>
</body>
</html>
