<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<!-- ============ PWA: Manifest, Theme Color, App Icon, Splash Screen ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  // Terapkan tema tersimpan SEBELUM stylesheet dirender, supaya tidak ada
  // kedip ke tema default — sekalian sinkronkan warna status bar
  // (meta theme-color) dengan warna background tema tersebut. Peta warna
  // di bawah HARUS sama dengan `swatch` di THEMES (lihat
  // src/js/themes/theme-manager.js) & --color-bg per tema di
  // src/css/themes.css.
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    var t = null;
    try {
      t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
    // System bars native sedini mungkin (sebelum module native-bridge jalan).
    // Plugin Capacitor kadang belum inject di frame pertama cold start —
    // poll singkat sampai siap, supaya warna bar langsung cocok tema
    // (bukan nunggu refresh).
    function applyNativeBars() {
      try {
        var Cap = window.Capacitor;
        if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return false;
        var id = document.documentElement.getAttribute("data-theme") || "light";
        var color = THEME_COLORS[id] || THEME_COLORS.light;
        var dark = id === "dark" || id === "oled";
        var SB = Cap.Plugins && Cap.Plugins.StatusBar;
        if (SB) {
          if (SB.setOverlaysWebView) SB.setOverlaysWebView({ overlay: true });
          if (SB.setBackgroundColor) SB.setBackgroundColor({ color: color });
          if (SB.setStyle) SB.setStyle({ style: dark ? "DARK" : "LIGHT" });
        }
        var NB = Cap.Plugins && Cap.Plugins.NavigationBar;
        if (NB && NB.setNavigationBarColor) {
          NB.setNavigationBarColor({ color: color, darkButtons: !dark });
        } else if (NB && NB.setColor) {
          NB.setColor({ color: color });
        }
        return !!(SB || NB);
      } catch (e) { return false; }
    }
    if (!applyNativeBars()) {
      var n = 0;
      var timer = setInterval(function () {
        n++;
        if (applyNativeBars() || n >= 60) clearInterval(timer);
      }, 50);
    }
  })();
</script>

<body>

<div class="page">

  <!-- ============ HEADER (Cadangkan & Impor) ============ -->
  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting">Cadangkan &amp; Impor</div>
    </div>
  </header>

  <!-- ============ CONTENT ============ -->
  <main class="home-content">

    <!-- Dua aksi utama: Cadangkan (SEMUA catatan, tiap note jadi .meimo
         LENGKAP dengan asset, dibungkus satu file .zip — lihat
         backup-service.js) & Impor (SATU file .meimo, DENGAN asset — lihat
         meimo-import.js). Beda cakupan (semua vs satu note), sengaja
         dipisah jadi 2 tombol, bukan digabung jadi satu alur. -->
    <section class="section">
      <div class="backup-actions">
        <button type="button" id="btnBackupAll" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title">Cadangkan Semua Catatan</span>
            <span class="backup-action-btn__desc">Unduh semua catatan sebagai .meimo (dengan gambar/musik), dibungkus satu file .zip</span>
          </span>
        </button>

        <button type="button" id="btnImportMeimo" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M4 5h16"/></svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title">Impor Catatan (.meimo)</span>
            <span class="backup-action-btn__desc">Masukkan satu file .meimo jadi catatan baru, lengkap dengan gambar/musiknya</span>
          </span>
        </button>
        <input type="file" id="importFileInput" accept=".meimo" hidden>

        <!-- Impor SEKALIGUS semua .meimo di dalam satu file .zip cadangan
             (hasil tombol "Cadangkan Semua Catatan" di atas) — beda dari
             tombol "Impor Catatan (.meimo)" yang cuma satu file/satu note.
             Wiring & validasi isinya ada di backup-import.js, lewat
             backup-service/backup-restore.js. -->
        <button type="button" id="btnImportBackupZip" class="backup-action-btn">
          <span class="backup-action-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 9v6"/><path d="M9.5 12.5L12 15l2.5-2.5"/></svg>
          </span>
          <span class="backup-action-btn__text">
            <span class="backup-action-btn__title">Impor Cadangan (.zip)</span>
            <span class="backup-action-btn__desc">Masukkan satu file .zip cadangan, semua .meimo di dalamnya langsung diimpor sekaligus</span>
          </span>
        </button>
        <input type="file" id="importBackupZipInput" accept=".zip" hidden>
      </div>
    </section>

  </main>

</div>

<script type="module" src="/src/js/notes/backup-import.js"></script>

</body>
</html>
