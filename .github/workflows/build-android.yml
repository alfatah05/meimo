name: Build Android App

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        # Pakai "npm install" (bukan "npm ci") karena repo ini belum commit
        # package-lock.json. Kalau nanti sudah ada lockfile, boleh ganti ke
        # "npm ci" untuk build yang lebih cepat & reproducible.
        run: npm install

      - name: Build web assets (www/)
        run: npm run build

      - name: Add Android platform
        # Folder android/ SENGAJA tidak di-commit ke repo (tidak butuh
        # kustomisasi kode native apa pun — routing & tombol back sudah
        # ditangani penuh di layer JS lewat service-worker.js &
        # src/js/pwa/native-bridge.js) — jadi selalu dibuat ulang dari
        # capacitor.config.json di setiap run, supaya repo tetap ringan.
        run: npx cap add android

      - name: Generate Android icons & splash screen
        run: npm run assets

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: meimo-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
