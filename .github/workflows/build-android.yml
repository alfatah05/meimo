name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Siapkan folder www (aset web statis)
        run: npm run build:www

      - name: Generate project Android (Capacitor)
        run: npx cap add android

      - name: Terapkan patch native (URL cantik + back button)
        run: node scripts/apply-native-patches.js

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Generate icon aplikasi dari resources/icon.png
        run: >
          npx capacitor-assets generate --android
          --assetPath resources
          --iconBackgroundColor '#1E1E1E'
          --iconBackgroundColorDark '#1E1E1E'
          --splashBackgroundColor '#1E1E1E'
          --splashBackgroundColorDark '#1E1E1E'

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
