name: Build Android App

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web assets (www/)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons & splash screen
        run: npm run assets

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore keystore cache
        uses: actions/cache@v4
        with:
          path: android/app/meimo-release.jks
          key: meimo-release-keystore-v1

      - name: Prepare release keystore
        working-directory: android/app
        env:
          MEIMO_KEYSTORE_BASE64: ${{ secrets.MEIMO_KEYSTORE_BASE64 }}
          MEIMO_KEYSTORE_PASSWORD: ${{ secrets.MEIMO_KEYSTORE_PASSWORD }}
          MEIMO_KEY_ALIAS: ${{ secrets.MEIMO_KEY_ALIAS }}
          MEIMO_KEY_PASSWORD: ${{ secrets.MEIMO_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "${MEIMO_KEYSTORE_BASE64}" ]; then
            echo "${MEIMO_KEYSTORE_BASE64}" | base64 -d > meimo-release.jks
            {
              echo "STORE_PASSWORD=${MEIMO_KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${MEIMO_KEY_ALIAS:-meimo}"
              echo "KEY_PASSWORD=${MEIMO_KEY_PASSWORD:-${MEIMO_KEYSTORE_PASSWORD}}"
            } > keystore.properties
            echo "Using keystore from GitHub Secrets"
          else
            if [ ! -f meimo-release.jks ]; then
              keytool -genkeypair -v \
                -keystore meimo-release.jks \
                -alias meimo \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass meimo-sideload \
                -keypass meimo-sideload \
                -dname "CN=Meimo, OU=Meimo, O=Meimo, L=Jakarta, ST=Jakarta, C=ID"
            fi
            {
              echo "STORE_PASSWORD=meimo-sideload"
              echo "KEY_ALIAS=meimo"
              echo "KEY_PASSWORD=meimo-sideload"
            } > keystore.properties
            echo "Using sideload keystore (cached between runs)"
          fi

      - name: Configure release signing in Gradle
        run: python3 scripts/configure-release-signing.py

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to meimo.apk
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*.apk.idsig" | head -1)
          echo "Found: $SRC"
          mkdir -p dist
          cp "$SRC" dist/meimo.apk
          ls -lh dist/meimo.apk

      - name: Upload meimo.apk
        uses: actions/upload-artifact@v4
        with:
          name: meimo-apk
          path: dist/meimo.apk
          if-no-files-found: error

      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: meimo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
