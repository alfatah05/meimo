name: Build APK

# Jalan otomatis tiap push ke main, atau manual lewat tab "Actions" -> "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependency npm
        run: npm install

      - name: Build www/ (copy file statis + bundle plugin Capacitor)
        run: npm run build

      - name: Tambahkan platform Android (kalau folder android/ belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor -> android/
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
