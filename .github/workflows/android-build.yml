name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Folder android/ tidak di-commit ke repo (dibuat ulang tiap build,
      # supaya tidak perlu generate lokal). Kalau folder ini SUDAH ada
      # di repo (mis. sudah pernah di-generate & di-commit manual), step
      # ini otomatis di-skip.
      - name: Add Android platform (kalau belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate icon & splash screen
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Sync web assets ke Android
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
