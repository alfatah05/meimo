/* BUGFIX v1.19.1: aturan opt-in @view-transition ini SENGAJA inline di
   sini (bukan di file eksternal src/css/view-transitions.css), dan
   SENGAJA ditaruh sepaling-atas mungkin di <head>. Sebelumnya aturan ini
   ada di dalam view-transitions.css yang posisi <link>-nya jauh di bawah
   ~10 stylesheet lain — kalau file itu belum selesai di-fetch/parse pas
   user buru-buru pindah halaman (terutama kunjungan pertama / cache
   masih dingin), browser belum sempat "kenal" opt-in ini, jadi animasi
   transisi halaman kadang dilewat begitu saja. Inline <style> dijamin
   langsung tersedia tanpa nunggu network sama sekali, jadi animasinya
   konsisten selalu jalan. Keyframes & style pseudo-element lain tetap di
   view-transitions.css seperti biasa. */
@view-transition {
  navigation: auto;
}
</style>

<!-- ============ PWA: Manifest, Theme Color, App Icon, Splash Screen ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  // Terapkan tema tersimpan SEBELUM stylesheet dirender, supaya tidak ada
  // kedip ke tema default — sekalian sinkronkan warna status bar
  // (meta theme-color) dengan warna background tema tersebut. Peta warna
  // di bawah HARUS sama dengan `swatch` di THEMES (lihat
  // src/js/themes/theme-manager.js) & --color-bg per tema di
  // src/css/themes.css.
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    try {
      var t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
  })();
</script>

<div class="note-page">

  <!-- Topbar: back button + toolbar 9-menu jadi SATU baris grid di ATAS.
       Posisi (top/left/right) dikelola oleh viewport-pin.js supaya selalu
       mengikuti visual viewport (misal saat browser mobile menggeser
       halaman untuk menampilkan field yang fokus). topbar-autohide.js
       menggeser baris ini keluar viewport saat user sedang scroll, dan
       memunculkannya lagi setelah scroll berhenti ~2 detik — KECUALI kalau
       child bar (baris kedua, lihat di bawah) sedang terbuka, lihat
       isChildGroupOpen() di src/js/utils/dom.js. -->

    <!-- ============ BARIS 1: TOPBAR — 9 menu, grid rata (1fr masing2),
         icon-only, TIDAK bisa discroll kesamping. ============ -->

           tombol lain di baris ini (lihat .note-topbar-row di layout.css) -->

      <!-- Text: Heading, Font, Font Size, Bold, Italic, Underline, Strikethrough -->

      <!-- Style: Font Color, Highlight, Align, Line Height, Letter Spacing -->

      <!-- Lists: Numbered List, Bullet List, Checklist -->

    <!-- ============ BARIS 3: BAR COLOR PICKER ============

         src/js/utils/dom.js — bukan floating panel, tapi baris penuh
         di bawah child bar, satu baris yang bisa digeser horizontal
         persis seperti .toolbar-child-bar. Kosong & hidden saat tidak
         ada picker yang aktif. Baris ini HILANG saat page discroll
         (lihat topbar-autohide.js), beda dengan child bar di atas. -->
    <div class="color-picker-bar" id="colorPickerBar" hidden></div>

    <!-- ============ BARIS 4: FONT FAMILY BAR ============
         Diisi oleh font-family-dropdown.js lewat openFontFamilyBar() di
         src/js/utils/dom.js — pola sama dengan color-picker-bar di atas
         (full-width, menempel jadi bagian topbar, BUKAN floating panel),
         tapi isinya daftar VERTIKAL (bisa panjang) jadi discroll vertikal
         dengan max-height 35vh (lihat .font-family-bar, toolbar.css) biar
         tidak menutupi seluruh area catatan di layar pendek. Kosong &
         hidden saat tidak ada dropdown Font Family yang aktif — sama
         seperti color-picker-bar, baris ini HILANG saat page discroll. -->
    <div class="font-family-bar" id="fontFamilyBar" hidden></div>
  </div>

  <!-- ============ AREA MENULIS ============ -->
  <!-- contenteditable dipakai sebagai MEDIA RENDER saja. Sumber data
       sesungguhnya adalah model dokumen JSON yang dikelola di
       src/js/editor/editor-state.js — lihat src/js/app.js. -->
  <div class="note-scroll-area">
    <div class="note-content is-loading">

      <!-- ============ SKELETON LOADING ============
           Tampil sejak awal (lewat class .is-loading di .note-content)
           selagi src/js/app.js memuat font kustom & dokumen note dari
           Document Service. app.js melepas class .is-loading begitu
           editor siap dirender, yang menyembunyikan blok ini lagi dan
           menampilkan #editorTitle/#editorBody sungguhan. Bentuknya
           sengaja meniru layout judul + paragraf isi, BUKAN skeleton
           generik seperti di index.html. -->
      <div class="editor-skeleton skeleton-overlay" aria-hidden="true">
        <div class="skeleton-bar editor-skeleton__title"></div>
        <div class="editor-skeleton__body">
          <div class="skeleton-bar editor-skeleton__line editor-skeleton__line--w1"></div>
          <div class="skeleton-bar editor-skeleton__line editor-skeleton__line--w2"></div>
          <div class="skeleton-bar editor-skeleton__line editor-skeleton__line--w1"></div>
          <div class="skeleton-bar editor-skeleton__line editor-skeleton__line--w3"></div>
        </div>
      </div>

      <div
        id="editorTitle"
        class="note-title-field"
        contenteditable="true"
        data-placeholder="Note title"
        data-i18n-attr="data-placeholder:editor.title.placeholder,aria-label:editor.title.aria"
        role="textbox"
        aria-multiline="false"
        aria-label="Note title"
      ></div>
      <div
        id="editorBody"
        class="note-body-field"
        contenteditable="true"
        data-placeholder="Start writing here…"
        data-i18n-attr="data-placeholder:editor.body.placeholder,aria-label:editor.body.aria"
        role="textbox"
        aria-multiline="true"
        aria-label="Note content"
      ></div>
    </div>
  </div>

</div>

<script type="module" src="/src/js/utils/viewport-pin.js"></script>
<script type="module" src="/src/js/utils/topbar-autohide.js"></script>
<script type="module" src="/src/js/app.js"></script>

<!-- ============ PWA: Service Worker (mode offline) ============ -->
<!-- Hanya urusan registrasi SW & capture event install, tidak menyentuh
     mesin editor / app.js sama sekali. -->
<script type="module" src="/src/js/pwa/sw-register.js"></script>
<script type="module" src="/src/js/pwa/install-prompt.js"></script>
<script type="module" src="/src/js/utils/native-feel.js"></script>

</body>
</html>
