<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<style>
/* BUGFIX v1.19.1: aturan opt-in @view-transition ini SENGAJA inline di
   sini (bukan di file eksternal src/css/view-transitions.css), dan
   SENGAJA ditaruh sepaling-atas mungkin di <head>. Sebelumnya aturan ini
   ada di dalam view-transitions.css yang posisi <link>-nya jauh di bawah
   ~10 stylesheet lain — kalau file itu belum selesai di-fetch/parse pas
   user buru-buru pindah halaman (terutama kunjungan pertama / cache
   masih dingin), browser belum sempat "kenal" opt-in ini, jadi animasi
   transisi halaman kadang dilewat begitu saja. Inline <style> dijamin
   langsung tersedia tanpa nunggu network sama sekali, jadi animasinya
   konsisten selalu jalan. Keyframes & style pseudo-element lain tetap di
   view-transitions.css seperti biasa. */
@view-transition {
  navigation: auto;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sampah — Catatan</title>

<!-- ============ PWA: Manifest, Theme Color, App Icon, Splash Screen ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  // Terapkan tema tersimpan SEBELUM stylesheet dirender, supaya tidak ada
  // kedip ke tema default — sekalian sinkronkan warna status bar
  // (meta theme-color) dengan warna background tema tersebut. Peta warna
  // di bawah HARUS sama dengan `swatch` di THEMES (lihat
  // src/js/themes/theme-manager.js) & --color-bg per tema di
  // src/css/themes.css.
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    try {
      var t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
  })();
</script>
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="/assets/splash/splash-screen.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meimo">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/variables.css">
<link rel="stylesheet" href="/src/css/themes.css">
<link rel="stylesheet" href="/src/css/view-transitions.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/typography.css">
<link rel="stylesheet" href="/src/css/layout.css">
<link rel="stylesheet" href="/src/css/notes-list.css">
<link rel="stylesheet" href="/src/css/toolbar.css">
<link rel="stylesheet" href="/src/css/animations.css">
<link rel="stylesheet" href="/src/css/responsive.css">
<link rel="stylesheet" href="/src/css/components.css">
<link rel="stylesheet" href="/src/css/skeleton.css">
</head>
<body>

<div class="page">

  <!-- ============ HEADER (Sampah) ============ -->
  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Back" data-i18n-aria="nav.back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting" data-i18n="trash.title">Trash</div>
    </div>
  </header>

  <!-- ============ CONTENT ============ -->
  <!-- Dirender oleh src/js/notes/trash.js dari data asli di IndexedDB lewat
       Document Service — catatan di sini adalah soft-delete (metadata.trashed),
       belum dihapus permanen sampai user menekan "Hapus Permanen". -->
  <main class="home-content">

    <div id="trashSectionSkeleton" class="list-skeleton skeleton-overlay" aria-hidden="true">
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
    </div>

    <section id="trashSection" class="section" hidden>
      <div class="section-header">
        <span class="section-title" data-i18n="trash.section">Deleted notes</span>
      </div>
      <div id="trashGrid" class="notes-grid"></div>
    </section>

    <div id="trashEmptyState" class="empty-state anim-fade-in" hidden>
      <svg class="empty-state__illustration" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="24 30 30 30 72 30"></polyline>
        <path d="M64 30l-3 40a6 6 0 0 1-6 6H41a6 6 0 0 1-6-6l-3-40"></path>
        <line x1="40" y1="42" x2="40" y2="62"></line>
        <line x1="56" y1="42" x2="56" y2="62"></line>
      </svg>
      <div class="empty-state__title" data-i18n="trash.empty.title">Trash is empty</div>
      <p class="empty-state__desc" data-i18n="trash.empty.desc">Notes you delete will appear here before permanent removal.</p>
    </div>

  </main>

</div>

<script type="module" src="/src/js/notes/trash.js"></script>

<!-- ============ PWA: Service Worker (mode offline) ============ -->
<script type="module" src="/src/js/pwa/sw-register.js"></script>
<script type="module" src="/src/js/pwa/install-prompt.js"></script>
<script type="module" src="/src/js/utils/native-feel.js"></script>

</body>
</html>
