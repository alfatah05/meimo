<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<style>
/* BUGFIX v1.19.1: aturan opt-in @view-transition ini SENGAJA inline di
   sini (bukan di file eksternal src/css/view-transitions.css), dan
   SENGAJA ditaruh sepaling-atas mungkin di <head>. Sebelumnya aturan ini
   ada di dalam view-transitions.css yang posisi <link>-nya jauh di bawah
   ~10 stylesheet lain — kalau file itu belum selesai di-fetch/parse pas
   user buru-buru pindah halaman (terutama kunjungan pertama / cache
   masih dingin), browser belum sempat "kenal" opt-in ini, jadi animasi
   transisi halaman kadang dilewat begitu saja. Inline <style> dijamin
   langsung tersedia tanpa nunggu network sama sekali, jadi animasinya
   konsisten selalu jalan. Keyframes & style pseudo-element lain tetap di
   view-transitions.css seperti biasa. */
@view-transition {
  navigation: auto;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Customisasi Kartu — Catatan</title>

<!-- ============ PWA: Manifest, Theme Color, App Icon, Splash Screen ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  // Terapkan tema tersimpan SEBELUM stylesheet dirender, supaya tidak ada
  // kedip ke tema default — sekalian sinkronkan warna status bar
  // (meta theme-color) dengan warna background tema tersebut. Peta warna
  // di bawah HARUS sama dengan `swatch` di THEMES (lihat
  // src/js/themes/theme-manager.js) & --color-bg per tema di
  // src/css/themes.css.
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    try {
      var t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
  })();
</script>
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="/assets/splash/splash-screen.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meimo">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/variables.css">
<link rel="stylesheet" href="/src/css/themes.css">
<link rel="stylesheet" href="/src/css/view-transitions.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/typography.css">
<link rel="stylesheet" href="/src/css/layout.css">
<link rel="stylesheet" href="/src/css/notes-list.css">
<link rel="stylesheet" href="/src/css/toolbar.css">
<link rel="stylesheet" href="/src/css/animations.css">
<link rel="stylesheet" href="/src/css/responsive.css">
<link rel="stylesheet" href="/src/css/components.css">
<link rel="stylesheet" href="/src/css/skeleton.css">
<link rel="stylesheet" href="/src/css/card-style.css">
</head>
<body>

<div class="page">

  <!-- ============ HEADER ============ -->
  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Back" data-i18n-aria="nav.back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting" data-i18n="cardStyle.title">Card customization</div>
    </div>
  </header>

  <!-- ============ CONTENT ============ -->
  <!-- Dirender & dikelola oleh src/js/notes/card-style.js. Pratinjau kartu
       (#cardPreviewSlot) memakai fungsi render kartu yang sama dengan Notes
       List (createNoteCard di notes/note-card.js) supaya hasilnya identik
       persis dengan tampilan di Home. -->
  <main class="home-content card-style-page">

    <!-- Skeleton loading: boot() di card-style.js nunggu loadNote() +
         ensureInstalledFontsLoaded()/getAvailableFonts() (IndexedDB) dulu
         sebelum apa pun dirender, jadi tanpa ini halaman kelihatan
         kosong/kedip putih sesaat. Bentuknya sengaja disamakan section per
         section dengan layout ASLI di bawah (Pratinjau, Font Judul, Bentuk
         Edge, Warna Latar, Gambar Latar) — beda dari skeleton grid kartu
         (Home) atau skeleton baris list generik (Font Library/Cadangkan/
         Sampah). Ditampilkan by default sejak first paint (tanpa nunggu
         JS), disembunyikan begitu render pertama selesai (lihat boot()
         di card-style.js). -->
    <div id="cardStyleSkeleton" class="card-style-skeleton skeleton-overlay" aria-hidden="true">
      <div class="skeleton-bar card-style-skeleton__bar card-style-skeleton__bar--tall"></div>
      <div class="skeleton-bar card-style-skeleton__bar"></div>
      <div class="skeleton-bar card-style-skeleton__bar"></div>
    </div>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.preview">Preview</span>
      </div>
      <div id="cardPreviewSlot" class="card-style-preview"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.titleFont">Title font</span>
      </div>
      <button type="button" id="fontSelect" class="card-style-select card-style-select--custom" aria-haspopup="listbox" aria-expanded="false">
        <span id="fontSelectLabel" class="card-style-select__label">Default</span>
        <svg class="card-style-select__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.edge">Edge shape</span>
      </div>
      <div id="edgeShapeList" class="card-style-shape-scroll"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.background">Background</span>
      </div>
      <div class="card-style-bg-card">
        <div class="card-style-bg-tabs" role="tablist" aria-label="Background type">
          <button type="button" class="card-style-bg-tab is-active" role="tab" id="bgTabNone" data-tab="none" aria-selected="true" data-i18n="cardStyle.bgTab.none">None</button>
          <button type="button" class="card-style-bg-tab" role="tab" id="bgTabColor" data-tab="color" aria-selected="false" data-i18n="cardStyle.bgTab.color">Color</button>
          <button type="button" class="card-style-bg-tab" role="tab" id="bgTabImage" data-tab="image" aria-selected="false" data-i18n="cardStyle.bgTab.image">Image</button>
        </div>

        <!-- Panel None: kosong, tinggi tetap -->
        <div class="card-style-bg-panel is-active" id="bgPanelNone" data-panel="none" role="tabpanel">
          <div class="card-style-bg-panel__empty" aria-hidden="true"></div>
        </div>

        <!-- Panel Color: opacity + custom + presets -->
        <div class="card-style-bg-panel" id="bgPanelColor" data-panel="color" role="tabpanel" hidden>
          <div class="card-style-bg-opacity" id="bgColorOpacityRow">
            <span class="card-style-bg-opacity__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none" opacity="0.35"/></svg>
            </span>
            <input type="range" id="bgColorOpacity" min="0" max="1" step="0.01" value="1" aria-label="Color opacity">
            <span class="card-style-bg-opacity__value" id="bgColorOpacityValue">100%</span>
            <label class="card-style-bg-custom" title="Custom color" data-i18n-attr="title:cardStyle.customColor">
              <input type="color" id="bgColorCustom" value="#4A55C7" aria-label="Custom color">
            </label>
          </div>
          <div id="bgColorList" class="card-style-bg-presets"></div>
        </div>

        <!-- Panel Image: opacity + upload/remove chips -->
        <div class="card-style-bg-panel" id="bgPanelImage" data-panel="image" role="tabpanel" hidden>
          <div class="card-style-bg-opacity" id="bgImageOpacityRow">
            <span class="card-style-bg-opacity__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none" opacity="0.35"/></svg>
            </span>
            <input type="range" id="bgImageOpacity" min="0" max="1" step="0.01" value="1" aria-label="Image opacity">
            <span class="card-style-bg-opacity__value" id="bgImageOpacityValue">100%</span>
          </div>
          <div class="card-style-bg-image-actions">
            <input type="file" id="bgImageInput" accept="image/*" hidden>
            <button type="button" id="bgImageUploadBtn" class="card-style-bg-chip card-style-bg-chip--primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span data-i18n="cardStyle.uploadImage">Upload image</span>
            </button>
            <button type="button" id="bgImageRemoveBtn" class="card-style-bg-chip card-style-bg-chip--danger" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span data-i18n="cardStyle.removeImage">Remove image</span>
            </button>
          </div>
        </div>
      </div>
    </section>

<section class="section">
      <div class="card-style-toggle-row">
        <div class="card-style-toggle-row__text">
          <span class="section-title" data-i18n="cardStyle.hideSnippet">Hide note content</span>
          <span class="card-style-toggle-row__hint" data-i18n="cardStyle.hideSnippetHint">Show title only on the card</span>
        </div>
        <button type="button" id="hideSnippetToggle" class="card-style-toggle" role="switch" aria-checked="false" aria-label="Hide note content">
          <span class="card-style-toggle__knob" aria-hidden="true"></span>
        </button>
      </div>
    </section>

  </main>

  <!-- ============ ACTION BAR ============ -->
  <div class="card-style-actionbar">
    <button type="button" id="resetBtn" class="modal-btn modal-btn--ghost" data-i18n="cardStyle.reset">Reset</button>
    <button type="button" id="saveBtn" class="modal-btn modal-btn--primary" data-i18n="cardStyle.save">Save</button>
  </div>

</div>

<script type="module" src="/src/js/notes/card-style.js"></script>

<!-- ============ PWA: Service Worker (mode offline) ============ -->
<script type="module" src="/src/js/pwa/sw-register.js"></script>
<script type="module" src="/src/js/pwa/install-prompt.js"></script>
<script type="module" src="/src/js/utils/native-feel.js"></script>

</body>
</html>
