    <style>
        /* Matikan blok-pilih teks di halaman ini juga, konsisten dgn
           halaman app lain (base.css) — biar berasa native, bukan web. */
        body {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Desain Scrollbar Halus */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090B;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f212d;
            border-radius: 3px;
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(17, 18, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }

        /* Tombol Utama berpendar */
        .btn-primary {
            background: linear-gradient(135deg, #A2ABFF 0%, #8892F0 50%, #6C77E8 100%);
            box-shadow: 0 0 30px rgba(136, 146, 240, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary:hover {
            box-shadow: 0 0 45px rgba(136, 146, 240, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        /* Latar belakang grid & mesh halus */
        .bg-mesh {
            background-image: 
                radial-gradient(at 50% 0%, rgba(136, 146, 240, 0.18) 0px, transparent 65%),
                radial-gradient(at 85% 30%, rgba(108, 119, 232, 0.1) 0px, transparent 50%),
                radial-gradient(at 15% 60%, rgba(162, 171, 255, 0.06) 0px, transparent 50%);
        }

        .bg-grid {
            background-size: 48px 48px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        }

        /* Animasi Fisika Korsel */
        .carousel-track {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            will-change: transform;
            cursor: grab;
        }

        .carousel-track:active {
            cursor: grabbing;
        }

        .carousel-item {
            flex: 0 0 auto;
            width: 290px;
            aspect-ratio: 9 / 16;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
            will-change: transform, opacity;
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (min-width: 640px) {
            .carousel-item {
                width: 330px;
            }
        }

        @media (min-width: 1024px) {
            .carousel-item {
                width: 360px;
            }
        }

        /* Item Aktif di Tengah (Tanpa Shadow Ungu) */
        .carousel-item.active {
            transform: scale(1.08);
            z-index: 20;
            opacity: 1;
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.8);
        }

        /* Item Samping yang Diperkecil */
        .carousel-item.inactive {
            transform: scale(0.85);
            z-index: 10;
            opacity: 0.55;
            border-color: rgba(255, 255, 255, 0.08);
        }

        /* Caption fade/slide when carousel index changes */
        .carousel-caption {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .carousel-caption.is-leaving {
            opacity: 0;
            transform: translateY(8px);
        }
        .carousel-caption.is-entering {
            opacity: 0;
            transform: translateY(-8px);
        }
        .carousel-caption.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Slide indicators: dot → pill when active */
        .carousel-indicators {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .carousel-indicator {
            height: 8px;
            width: 8px;
            border-radius: 999px;
            border: none;
            padding: 0;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1),

        }
        .carousel-indicator:hover {
            background: rgba(255, 255, 255, 0.45);
        }
        .carousel-indicator.is-active {
            width: 28px;
            background: #8892F0;
        }
    </style>

    <!-- Registrasi Service Worker & penangkap event install PWA (modul asli
         project Meimo — sama seperti yang dipakai index.html/editor.html) -->
    <script type="module" src="/src/js/pwa/sw-register.js"></script>
    <script type="module">
        import { initInstallAvailability, triggerInstall } from "/src/js/pwa/install-prompt.js";

        const downloadBtn = document.getElementById("download-btn");
        const statusEl = document.getElementById("download-status");
        let installAvailable = false;

        function setStatus(text) {
            if (statusEl) statusEl.textContent = text;
        }

        window.addEventListener("meimo:install-availability", (e) => {
            installAvailable = e.detail.available;
        });
        initInstallAvailability();

        downloadBtn?.addEventListener("click", async (e) => {
            e.preventDefault();

            if (installAvailable) {
                setStatus("Preparing installation…");
                const outcome = await triggerInstall();
                installAvailable = false;

                if (outcome === "accepted") {
                    setStatus("Meimo is being installed on your device…");
                } else if (outcome === "dismissed") {
                    setStatus("Installation cancelled. You can try again anytime.");
                } else {
                    setStatus("Installation is not available right now. Opening Meimo…");
                    window.location.href = "/library";
                }
                return;
            }

            // Browser ini tidak menawarkan prompt instal otomatis (mis. Safari
            // desktop/iOS), atau Meimo sudah terpasang sebelumnya — arahkan ke
            // aplikasinya langsung, sambil kasih tahu cara pasang manual.
            setStatus("Opening Meimo — if it is not installed yet, use \"Add to Home Screen\" in your browser.");
            window.location.href = "/library";
        });
    </script>

    <!-- Script Korsel & Partikel -->
    <script>
        // Inisialisasi Icon Lucide
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            initParticleCanvas();
            initCarousel();
        });

        // Carousel — 6 slides, caption + indicators, lazy-load images
        function initCarousel() {
            const track = document.getElementById('carousel-track');
            const viewport = document.getElementById('carousel-viewport');
            const captionEl = document.getElementById('carousel-caption');
            const indicatorsEl = document.getElementById('carousel-indicators');

            const allItems = Array.from(track.children);
            let activeIndex = 0;
            let isDragging = false;
            let startX = 0;
            let captionTimer = null;

            // Build indicators
            indicatorsEl.innerHTML = '';
            allItems.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'carousel-indicator' + (idx === activeIndex ? ' is-active' : '');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-label', 'Go to slide ' + (idx + 1));
                btn.addEventListener('click', () => {
                    if (idx !== activeIndex) {
                        activeIndex = idx;
                        updateCarousel();
                    }
                });
                indicatorsEl.appendChild(btn);
            });
            const indicatorBtns = Array.from(indicatorsEl.children);

            function loadSlideImage(item) {
                if (!item) return;
                const img = item.querySelector('img');
                if (!img) return;
                const src = img.getAttribute('data-src') || item.getAttribute('data-src');
                if (!src) return;
                if (img.getAttribute('src') === src) return;
                img.setAttribute('src', src);
                img.removeAttribute('data-src');
            }

            function ensureNearbyLoaded(centerIdx) {
                // Load active ±1 for snappy swipe
                for (let i = centerIdx - 1; i <= centerIdx + 1; i++) {
                    if (i >= 0 && i < allItems.length) loadSlideImage(allItems[i]);
                }
            }

            function setCaption(nextText) {
                if (!captionEl) return;
                const next = nextText || '';
                if (captionEl.textContent === next && captionEl.classList.contains('is-visible')) return;
                captionEl.classList.remove('is-visible', 'is-entering');
                captionEl.classList.add('is-leaving');
                clearTimeout(captionTimer);
                captionTimer = setTimeout(() => {
                    captionEl.textContent = next;
                    captionEl.classList.remove('is-leaving');
                    captionEl.classList.add('is-entering');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            captionEl.classList.remove('is-entering');
                            captionEl.classList.add('is-visible');
                        });
                    });
                }, 180);
            }

            function updateCarousel() {
                if (!allItems.length) return;
                const viewportWidth = viewport.offsetWidth;
                const itemWidth = allItems[0].offsetWidth;
                const gap = 40;
                const step = itemWidth + gap;

                const centerOffset = (viewportWidth / 2) - (itemWidth / 2);
                const targetTranslate = centerOffset - (activeIndex * step);

                track.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                track.style.transform = 'translateX(' + targetTranslate + 'px)';

                allItems.forEach((item, idx) => {
                    if (idx === activeIndex) {
                        item.classList.add('active');
                        item.classList.remove('inactive');
                    } else {
                        item.classList.remove('active');
                        item.classList.add('inactive');
                    }
                });

                indicatorBtns.forEach((btn, idx) => {
                    btn.classList.toggle('is-active', idx === activeIndex);
                    btn.setAttribute('aria-selected', idx === activeIndex ? 'true' : 'false');
                });

                ensureNearbyLoaded(activeIndex);

                const cap = allItems[activeIndex] && allItems[activeIndex].getAttribute('data-caption');
                setCaption(cap || '');
            }

            function goNext() {
                if (activeIndex < allItems.length - 1) {
                    activeIndex++;
                    updateCarousel();
                }
            }

            function goPrev() {
                if (activeIndex > 0) {
                    activeIndex--;
                    updateCarousel();
                }
            }

            allItems.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (idx !== activeIndex) {
                        activeIndex = idx;
                        updateCarousel();
                    }
                });
            });

            track.addEventListener('mousedown', dragStart);
            track.addEventListener('touchstart', dragStart, { passive: true });
            track.addEventListener('mousemove', dragMove);
            track.addEventListener('touchmove', dragMove, { passive: true });
            track.addEventListener('mouseup', dragEnd);
            track.addEventListener('mouseleave', dragEnd);
            track.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true;
                startX = getPositionX(e);
            }

            function dragMove(e) {
                if (!isDragging) return;
                const currentX = getPositionX(e);
                const diff = currentX - startX;
                if (Math.abs(diff) > 40) {
                    if (diff < 0) goNext();
                    else goPrev();
                    isDragging = false;
                }
            }

            function dragEnd() {
                isDragging = false;
            }

            function getPositionX(e) {
                return e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            }

            window.addEventListener('resize', updateCarousel);
            // Prefetch first slide immediately, then layout
            loadSlideImage(allItems[0]);
            setTimeout(updateCarousel, 50);
        }

        // Animasi Partikel Latar Belakang
        function initParticleCanvas() {
            const canvas = document.getElementById('hero-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.5 + 0.3;
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.speedY = (Math.random() - 0.5) * 0.2;
                    this.opacity = Math.random() * 0.4 + 0.1;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.fillStyle = `rgba(136, 146, 240, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 30; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
